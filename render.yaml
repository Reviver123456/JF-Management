# Render Blueprint — https://jf-management.onrender.com
services:
  - type: web
    name: jf-management
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/db/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://jf-management.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://jf-management.onrender.com/api/auth/google/callback
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jf-management-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: jf-management-db
    plan: free
    region: singapore
